name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Static Code Analysis (ESLint)
        run: npm run lint || echo "Lint warnings reviewed"

  build-and-compile:
    name: Build & Artifact Validation
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Compile Application (Vite 8)
        run: npm run build

      - name: Verify Bundle Integrity
        run: |
          test -f dist/index.html || { echo "Build artifact missing: dist/index.html"; exit 1; }
          echo "Build integrity check passed."
